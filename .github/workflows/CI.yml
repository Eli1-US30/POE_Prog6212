name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder does not exist."
            exit 1
          fi
          echo "SUCCESS: docs folder exists."

      - name: Check required files
        run: |
          test -f "docs/APIEndPoint_POE.docx"
          test -f "docs/ERD_RaceDay.drawio.png"
          test -f "docs/SQLQuery1.sql"

          echo "SUCCESS: All required files are present in docs."
